<style>

body{margin:0;font:14px/1.45 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}

:root[data-theme=dark]{--bg:#0a1224;--card:#13203c;--tx:#e8edf8;--mut:#93a0bd;--bd:#25365c}
@media(max-width:760px){button,select,input{min-height:42px}}

</style></head><body>

<script>
const CATS=['Relationship Call','Sales Follow-up','Low-Volume Order Follow-up','Autozone Branch Manager Check-in','Head Office Follow-up','Portal Assistance','Econnect+ Navigation','Customer Service','Delivery Follow-up','Quotation Follow-up','New Business Lead','General Enquiry'];
const OUT=['Successfully Contacted','No Answer','Phone Busy','Call Back Requested','Follow-up Required','Customer Not Interested','Wrong Number','Number Unavailable'];
const GROUPS=['Autozone Branch Managers','Existing Customers','Low-Volume Customers','CRM Leads','New Prospects','Closed Accounts'];
const SUCC=['Successfully Contacted','Call Back Requested','Follow-up Required','Customer Not Interested'];
const DEF={v:2,target:35,blocks:[['07:30','08:30',0,0,0,'Planning & quick check: urgent emails; order issues; 5-10 min quick sales calls'],['08:30','09:30',3,1,1],['09:30','10:15',2,2,1],['10:15','10:30',0,0,0,'Morning tea'],['10:30','11:30',2,1,2],['11:30','12:30',2,2,1],['12:30','13:30',2,1,2],['13:30','14:30',2,2,1],['14:30','15:30',0,0,0,'Lunch'],['15:30','16:15',2,1,2],['16:15','16:30',0,0,0,'Afternoon tea'],['16:30','17:00',0,0,0,'Wrap-up & next day prep: review tasks; log carry-overs; set priorities']]};
let S;try{S=JSON.parse(localStorage.getItem('cf')||'null')}catch(e){}
S=S||{cust:[],calls:[],fu:[],cfg:DEF,order:{},skip:{}};if(S.cfg.v!=2)S.cfg=JSON.parse(JSON.stringify(DEF));S.cust.forEach(c=>{if(['Symmetry','Aplus','Tekkies','Head Office'].includes(c.grp))c.grp='Existing Customers'});
const save=()=>{try{localStorage.setItem('cf',JSON.stringify(S))}catch(e){alert('Storage full or blocked: export a backup now.')}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dstr(new Date());
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b},nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const real=()=>S.calls.filter(c=>!c.imp);
const todays=()=>real().filter(c=>c.date==today());
const cu=id=>S.cust.find(c=>c.id==id)||{};
const isWork=()=>{const d=new Date().getDay();return d>0&&d<6};
function slots(){const out=[];S.cfg.blocks.forEach(b=>{const s=mins(b[0]),e=mins(b[1]),ty=['S'.repeat(b[2]),'P'.repeat(b[3]),'L'.repeat(b[4])].join('').split(''),n=ty.length;if(!n){out.push({t:b[0],e:b[1],brk:b[5]||'Break'});return}const step=(e-s)/n;ty.forEach((y,i)=>{const v=Math.round(s+i*step);out.push({t:pad(Math.floor(v/60))+':'+pad(v%60),y})})});return out}
const TN={S:'Sales',P:'Portal',L:'Lead'};
function pools(){const td=today(),mo=td.slice(0,7),done=new Set(todays().map(c=>c.cid)),cm=new Set(real().filter(c=>c.date.slice(0,7)==mo&&SUCC.includes(c.outcome)).map(c=>c.cid)),last={},fu=new Set(S.fu.filter(f=>!f.done&&f.date<=td).map(f=>f.cid));
 real().forEach(c=>{if(c.date>(last[c.cid]||''))last[c.cid]=c.date});
 const isL=c=>c.grp=='CRM Leads'||c.grp=='New Prospects',el=S.cust.filter(c=>c.grp!='Closed Accounts'&&c.rel!='Competitor'&&!done.has(c.id)&&!S.skip[td+c.id]&&(fu.has(c.id)||!cm.has(c.id)));
 const rr=l=>{const m={};l.sort((a,b)=>(a.tier||9)-(b.tier||9)||(last[a.id]||'').localeCompare(last[b.id]||'')).forEach(c=>{const k=c.accr||'Unspecified';(m[k]=m[k]||[]).push(c.id)});let ks=Object.keys(m).sort();const r=Math.floor(Date.parse(td)/864e5)%(ks.length||1);ks=[...ks.slice(r),...ks.slice(0,r)];const out=[];for(let i=0;ks.some(k=>m[k][i]);i++)ks.forEach(k=>{if(m[k][i])out.push(m[k][i])});return[...out.filter(i=>fu.has(i)),...out.filter(i=>!fu.has(i))]};
 const o=S.order[td]||[],ap=a=>[...o.filter(i=>a.includes(i)),...a.filter(i=>!o.includes(i))];
 return{S:ap(rr(el.filter(c=>!isL(c)))),L:ap(rr(el.filter(isL)))}}
function plan(){const p=pools(),dn=todays(),ix={S:0,L:0};let i=0;return slots().map(s=>{if(s.brk)return s;const d=dn[i++];if(d)return{...s,done:d};const k=s.y=='L'?'L':'S';return{...s,cid:p[k][ix[k]++]}})}
function queueOld(){const td=today(),done=new Set(todays().map(c=>c.cid));
 const fus=S.fu.filter(f=>!f.done&&f.date<=td).map(f=>f.cid);
 const last={};real().forEach(c=>last[c.cid]=c.date>(last[c.cid]||'')?c.date:last[c.cid]);
 const rest=S.cust.filter(c=>c.grp!='Closed Accounts'&&c.rel!='Competitor').sort((a,b)=>(a.tier||9)-(b.tier||9)||(last[a.id]||'').localeCompare(last[b.id]||'')).map(c=>c.id);
 const ids=[...new Set([...fus,...rest])].filter(i=>!done.has(i)&&!S.skip[td+i]);
 const o=S.order[td]||[];return[...o.filter(i=>ids.includes(i)),...ids.filter(i=>!o.includes(i))]}
const nav=['Dashboard','Daily Call Planner','Customer Database','Call Recording','Follow-ups','Autozone Contacts','CRM Leads','Reports & Analytics','Settings'];
let view='Dashboard',flt={q:'',g:'',st:'',ca:'',ac:''},prof=null;
function go(v){view=v;prof=null;render()}
function render(){$('nav').innerHTML='<h1>Etraction <b>CallFlow</b></h1>'+nav.map(n=>`<a class="${n==view?'on':''}" onclick="go('${n}')">${n}</a>`).join('')+'<a onclick="th()">Dark / light mode</a>';
 const f={Dashboard,'Daily Call Planner':planner,'Customer Database':()=>db(),'Call Recording':recLog,'Follow-ups':fups,'Autozone Contacts':()=>db('Autozone Branch Managers'),'CRM Leads':()=>db('CRM Leads'),'Reports & Analytics':reports,Settings:settings}[view];
 $('v').innerHTML=prof?profile(prof):f();if(view=='Dashboard'&&!prof)clearTimeout(window.tm),window.tm=setTimeout(()=>{if(view=='Dashboard'&&!prof&&!$('m').style.display.includes('flex'))render()},30000)}
function pace(){const n=todays().length,T=S.cfg.target,rem=Math.max(0,T-n),now=nowM();
 const left=slots().filter(s=>!s.brk&&mins(s.t)>=now).length;let wl=0;S.cfg.blocks.forEach(b=>{if(b[2]+b[3]+b[4])wl+=Math.max(0,mins(b[1])-Math.max(now,mins(b[0])))});
 const sched=slots().filter(s=>!s.brk&&mins(s.t)<now).length;return{n,rem,left,wl,sched,behind:isWork()&&sched>n}}
function Dashboard(){const p=pace(),T=S.cfg.target,pc=Math.round(p.n/T*100),td=today();
 const fd=S.fu.filter(f=>!f.done&&f.date==td).length,ov=S.fu.filter(f=>!f.done&&f.date<td).length,cc=new Set(todays().map(c=>c.cid)).size,mo=td.slice(0,7),mc=new Set(real().filter(c=>c.date.slice(0,7)==mo&&SUCC.includes(c.outcome)).map(c=>c.cid)).size+'/'+S.cust.filter(c=>c.grp!='Closed Accounts'&&c.rel!='Competitor').length;
 const msg=p.n>T?'Target exceeded. Outstanding work!':p.n==T?'Daily target achieved. Well done!':p.n>=T*.75?'Almost there, keep the momentum.':p.n>=T/2?'Halfway through, good progress.':p.n?'Good start, stay consistent.':'New day. First call sets the tone.';
 const h=Math.floor(p.wl/60),m=p.wl%60,per=p.left?(p.rem/p.left).toFixed(1):'-';
 return`<h2>Dashboard</h2><div class="c"><b>${msg}</b> <span class="tag">${p.n>T?'Target exceeded':p.n==T?'Daily target achieved':'Target not reached'}</span>
 <div class="bar ${p.n>=T?'ok':''}" style="margin:10px 0"><i style="width:${Math.min(100,pc)}%"></i></div>
 <span class="${p.behind?'bad':''}">${p.behind?'Behind schedule: '+(p.sched-p.n)+' calls. ':''}Need ${p.rem} more in ${h}h ${m}m of calling time (about ${per} per remaining slot).</span>${isWork()?'':' <b>Today is not a working day.</b>'}</div>
 <div class="g">${[['Daily target',T],['Completed today',p.n],['Remaining',p.rem],['Achieved',pc+'%'],['Scheduled today',slots().filter(s=>!s.brk).length],['Follow-ups due today',fd],['Overdue follow-ups',ov],['Customers contacted',cc],['Contacted this month',mc],['Time now',new Date().toTimeString().slice(0,5)]].map(k=>`<div class="c k"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
 <div class="c"><b>Next customer to call</b><div id="nx">${nextHtml()}</div></div><div class="c"><b>Month coverage</b> ${mc}<div class="bar" style="margin:8px 0"><i style="width:${Math.round(parseInt(mc)/(parseInt(mc.split('/')[1])||1)*100)}%"></i></div><button onclick="flt.ca='nm';go('Customer Database')">See who is left to contact this month</button></div>`}
function nextHtml(){const r=plan().find(x=>x.cid);if(!r)return'<p>No eligible customers. Import your workbook in Settings, or everyone has been contacted this month.</p>';const c=cu(r.cid);return`<p>${esc(c.name)} · ${esc(c.contact)} · ${esc(c.phone)} <span class="tag">${TN[r.y]}</span> <button class="p" onclick="openCall('${c.id}',null,'${r.y}')">Record call</button></p>`}
function planner(){const sl=plan(),p=pace(),td=today();
 return`<h2>Daily Call Planner</h2><p class="${p.behind?'bad':''}">${p.n}/${S.cfg.target} done. ${p.behind?'You are behind schedule.':'On track.'} Accreditations are rotated evenly each day. Customers already contacted this month are not scheduled (due follow-ups excepted).</p><div class="c tw"><table><tr><th>Time</th><th>Type</th><th>Customer</th><th>Accreditation</th><th>Contact</th><th>Phone</th><th>Status</th><th></th></tr>
 ${sl.map(s=>{if(s.brk)return`<tr><td>${s.t}-${s.e}</td><td colspan="7"><span class="tag">${esc(s.brk)}</span></td></tr>`;
 if(s.done){const d=s.done;return`<tr><td>${s.t}</td><td>${TN[s.y]}</td><td>${esc(cu(d.cid).name)}</td><td>${esc(cu(d.cid).accr)}</td><td colspan="2">${esc(d.outcome)}</td><td class="okc">Completed ${d.time}</td><td></td></tr>`}
 if(!s.cid)return`<tr><td>${s.t}</td><td>${TN[s.y]}</td><td colspan="6">No eligible customer left</td></tr>`;
 const c=cu(s.cid),od=mins(s.t)<nowM()&&isWork();
 return`<tr><td>${s.t}</td><td>${TN[s.y]}</td><td>${esc(c.name)}</td><td>${esc(c.accr)}</td><td>${esc(c.contact)}</td><td>${esc(c.phone)}</td><td class="${od?'bad':''}">${od?'Overdue':'Pending'}</td><td><button class="s p" onclick="openCall('${s.cid}',null,'${s.y}')">Call</button> <button class="s" onclick="mv('${s.cid}',-1)">Up</button> <button class="s" onclick="mv('${s.cid}',1)">Down</button> <button class="s" onclick="S.skip[today()+'${s.cid}']=1;save();render()">Skip</button></td></tr>`}).join('')}</table></div><p>Skipped today: ${Object.keys(S.skip).filter(k=>k.startsWith(td)).length}</p>`}
function planner0(){const q=[],sl=slots(),dn=todays(),p=pace();let i=0;
 return`<h2>Daily Call Planner</h2><p class="${p.behind?'bad':''}">${p.n}/${S.cfg.target} done. ${p.behind?'You are behind schedule.':'On track.'} Calls only slot into working blocks; breaks are blocked.</p><div class="c tw"><table><tr><th>Time</th><th>Customer</th><th>Contact</th><th>Phone</th><th>Status</th><th></th></tr>
 ${sl.map(s=>{if(s.brk)return`<tr><td>${s.t}-${s.e}</td><td colspan="5"><span class="tag">${s.brk}</span></td></tr>`;
 const d=dn[i];if(d){i++;return`<tr><td>${s.t}</td><td>${esc(cu(d.cid).name)}</td><td colspan="2">${esc(d.outcome)}</td><td class="okc">Completed ${d.time}</td><td></td></tr>`}
 const id=q[0+(i-dn.length)>=0?i-dn.length:0];const k=i-dn.length;const cid=q[k];i++;if(!cid)return`<tr><td>${s.t}</td><td colspan="5">-</td></tr>`;const c=cu(cid),od=mins(s.t)<nowM()&&isWork();
 return`<tr><td>${s.t}</td><td>${esc(c.name)}</td><td>${esc(c.contact)}</td><td>${esc(c.phone)}</td><td class="${od?'bad':''}">${od?'Overdue':'Pending'}</td><td><button class="s p" onclick="openCall('${cid}')">Call</button> <button class="s" onclick="mv('${cid}',-1)">Up</button> <button class="s" onclick="mv('${cid}',1)">Down</button> <button class="s" onclick="S.skip[today()+'${cid}']=1;save();render()">Skip</button></td></tr>`}).join('')}</table></div>
 <p>Skipped today: ${Object.keys(S.skip).filter(k=>k.startsWith(today())).length}</p>`}
function mv(id,d){const td=today(),p=pools(),k=p.S.includes(id)?'S':'L',a=[...p[k]],i=a.indexOf(id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.order[td]=[...a,...p[k=='S'?'L':'S']];save();render()}
function db(g){const td=today(),mo=td.slice(0,7),last={},cm=new Set(),fo=new Set(),ov=new Set();real().forEach(c=>{if(c.date>(last[c.cid]||''))last[c.cid]=c.date;if(c.date.slice(0,7)==mo&&SUCC.includes(c.outcome))cm.add(c.cid)});S.fu.filter(f=>!f.done).forEach(f=>{fo.add(f.cid);if(f.date<td)ov.add(f.cid)});const cut=dstr(new Date(Date.now()-30*864e5)),CA={nm:c=>!cm.has(c.id),cm:c=>cm.has(c.id),nv:c=>!last[c.id],s30:c=>(last[c.id]||'')<cut,fo:c=>fo.has(c.id),ov:c=>ov.has(c.id)};const cs=S.cust.filter(c=>(!flt.ca||CA[flt.ca](c))&&(!flt.ac||(c.accr||'Unspecified')==flt.ac)&&(!g||c.grp==g)&&(!flt.g||c.grp==flt.g)&&(!flt.st||c.state==flt.st)&&(!flt.q||(c.name+c.reg+c.acct+c.contact+c.city+c.accr).toLowerCase().includes(flt.q.toLowerCase())));
 const sts=[...new Set(S.cust.map(c=>c.state).filter(Boolean))].sort(),acs=[...new Set(S.cust.map(c=>c.accr||'Unspecified'))].sort();
 return`<h2>${g||'Customer Database'} (${cs.length})</h2><div class="row np"><button class="p" onclick="addC()">+ Add customer</button><input placeholder="Search name, account, contact, city, accreditation" value="${esc(flt.q)}" oninput="flt.q=this.value;rr()" style="min-width:260px">
 ${g?'':`<select onchange="flt.g=this.value;render()"><option value="">All categories</option>${GROUPS.map(x=>`<option ${flt.g==x?'selected':''}>${x}</option>`).join('')}</select>`}
 <select onchange="flt.st=this.value;render()"><option value="">All provinces</option>${sts.map(x=>`<option ${flt.st==x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <select onchange="flt.ac=this.value;render()"><option value="">All accreditations</option>${acs.map(x=>`<option ${flt.ac==x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <select onchange="flt.ca=this.value;render()">${[['','All contact statuses'],['nm','Not contacted this month'],['cm','Contacted this month'],['nv','Never contacted'],['s30','Not contacted in 30 days'],['fo','Has open follow-up'],['ov','Overdue follow-up']].map(x=>`<option value="${x[0]}" ${flt.ca==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
 <div class="c tw"><table id="tb"><tr><th>Account</th><th>Name</th><th>Category</th><th>Contact</th><th>Phone</th><th>City</th><th>Accreditation</th><th>Tier</th><th>Last call</th><th></th></tr>
 ${cs.slice(0,300).map(c=>{const l=real().filter(x=>x.cid==c.id).map(x=>x.date).sort().pop()||'';return`<tr><td>${esc(c.acct)}</td><td>${esc(c.name)}</td><td><span class="tag">${esc(c.grp)}</span></td><td>${esc(c.contact)}</td><td>${esc(c.phone)}</td><td>${esc(c.city)}</td><td>${esc(c.accr)}</td><td>${esc(c.tier)}</td><td>${l}</td><td><button class="s p" onclick="openCall('${c.id}')">Call</button> <button class="s" onclick="prof='${c.id}';render()">Profile</button></td></tr>`}).join('')||'<tr><td colspan="10">No records. Import your workbook in Settings.</td></tr>'}</table></div>${cs.length>300?'<p>Showing first 300. Refine the search.</p>':''}`}
function rr(){const p=pos();render();const e=document.querySelector('input');if(e){e.focus();e.setSelectionRange(1e3,1e3)}}function pos(){}
function profile(id){const c=cu(id),cl=S.calls.filter(x=>x.cid==id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),f=S.fu.filter(x=>x.cid==id&&!x.done);
 const rows=[['Account',c.acct],['Registered name',c.reg],['Contact',c.contact],['Alternate',c.alt],['Phone',c.phone],['Email',c.email],['Accreditation',c.accr],['Address',c.addr],['City',c.city],['Province',c.state],['Channel',c.channel],['Relationship',c.rel],['Terms',c.terms],['Credit limit',c.credit],['Salesperson',c.sp],['Tier',c.tier],['Tags and notes',c.tags||''],['Original values (before edits)',c.orig?Object.entries(c.orig).map(e=>e[0]+': '+e[1]).join(', '):'']];
 return`<button onclick="prof=null;render()">Back</button><h2>${esc(c.name)}</h2><div class="row"><button class="p" onclick="openCall('${id}')">Record call</button>
